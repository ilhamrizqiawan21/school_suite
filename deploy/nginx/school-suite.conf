# ==============================================================================
# Nginx Configuration Template — School Suite Production
# Path: /etc/nginx/sites-available/school-suite.conf
# ==============================================================================

# 1. HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name school.sch.id www.school.sch.id;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name school.sch.id www.school.sch.id;

    # Document Root (points to active deployment symlink)
    root /var/www/school_suite/current/public;
    index index.php index.html;

    # SSL / TLS Certificate (Let's Encrypt / Custom)
    ssl_certificate /etc/letsencrypt/live/school.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/school.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers (Defense in Depth)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max Upload Size (for bulk import and student document attachments)
    client_max_body_size 25M;

    # Logging
    access_log /var/log/nginx/school_suite_access.log;
    error_log /var/log/nginx/school_suite_error.log warn;

    # Main Application Route
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static Assets Caching (Vite build output)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Block access to hidden files (.env, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block direct PHP execution inside storage or upload directories
    location ~* /(?:storage|uploads)/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # PHP-FPM FastCGI Handler
    # Keep this after the storage/uploads deny rule: Nginx uses the first
    # matching regular-expression location.
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
        fastcgi_hide_header X-Powered-By;
    }
}

