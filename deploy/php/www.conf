; ==============================================================================
; PHP-FPM Pool Configuration — School Suite Production
; Path: /etc/php/8.2/fpm/pool.d/www.conf
; ==============================================================================

[www]
user = www-data
group = www-data

listen = /var/run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Manager Mode
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 15
pm.max_requests = 1000

; Request Timeout Protection
request_terminate_timeout = 120s

; PHP Settings Lockdown
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 30M
php_admin_value[max_execution_time] = 60
php_admin_value[date.timezone] = Asia/Jakarta

; Error Logging
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/school-suite-error.log
