; ==============================================================================
; OPcache Configuration — School Suite Production
; Path: /etc/php/8.2/fpm/conf.d/10-opcache.ini
; ==============================================================================

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.max_wasted_percentage = 5

; In production, disable timestamp validation for maximum throughput.
; (OPcache is flushed automatically via deployment script reload)
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0

; Preserve PHP 8 attributes and annotations
opcache.save_comments = 1
opcache.load_comments = 1
opcache.fast_shutdown = 1
