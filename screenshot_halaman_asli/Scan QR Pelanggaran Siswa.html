<script src="./Scan QR Pelanggaran Siswa_files/jquery-3.5.1.min.js"></script>
<script>
    let html5QrCode;
    let isScanning = false;

    function onScanSuccess(decodedText, decodedResult) {
        console.log(`Scan result: ${decodedText}`, decodedResult);
        
        // Stop scanning
        stopCamera().then(() => {
             // Redirect
             window.location.href = "input_pelanggaran.php?nisn=" + encodeURIComponent(decodedText);
        });
    }

    function onScanError(errorMessage) {
        // handle on error condition
    }

    async function startCamera() {
        try {
            html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start(
                { facingMode: "environment" },
                {
                    fps: 10,
                    qrbox: 180,
                    aspectRatio: 1.0,
                    formatsToSupport: [ 
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.EAN_13
                    ]
                },
                onScanSuccess,
                onScanError
            );
            
            // UI Updates
            isScanning = true;
            $('#idle-placeholder').hide();
            $('.scan-area-wrapper').addClass('scanning-active');
            
            // Change Button to Stop
            $('#camera-permission').removeClass('btn-custom-camera').addClass('btn-custom-stop')
                .html('<i class="fas fa-stop mr-2"></i> STOP KAMERA');

        } catch (err) {
            console.error(err);
             iziToast.error({
                title: 'Error',
                message: 'Gagal mengakses kamera: ' + err,
                position: 'topCenter'
            });
        }
    }

    async function stopCamera() {
        if(html5QrCode && isScanning) {
            try {
                await html5QrCode.stop();
                html5QrCode.clear();
                
                // UI Updates
                isScanning = false;
                $('#idle-placeholder').show();
                $('.scan-area-wrapper').removeClass('scanning-active');
                
                // Change Button to Start
                $('#camera-permission').removeClass('btn-custom-stop').addClass('btn-custom-camera')
                    .html('<i class="fas fa-camera mr-2"></i> MULAI SCAN KAMERA');
                    
            } catch (err) {
                console.error("Failed to stop", err);
            }
        }
    }

    $("#camera-permission").click(function(){
        if(isScanning) {
            stopCamera();
        } else {
            startCamera();
        }
    });

    // Manual Input Handler
    $("#btn-manual").click(function() {
        var code = $("#manual-code").val().trim();
        if (code !== "") {
            window.location.href = "input_pelanggaran.php?nisn=" + encodeURIComponent(code);
        } else {
             iziToast.warning({
                title: 'Hei!',
                message: 'NISN tidak boleh kosong',
                position: 'topCenter'
            });
        }
    });

    $("#manual-code").on('keypress', function(e) {
        if (e.which === 13) {
            $("#btn-manual").click();
        }
    });
    
    function onlyNumberKey(evt) {
        var ASCIICode = (evt.which) ? evt.which : evt.keyCode
        if (ASCIICode > 31 && (ASCIICode < 48 || ASCIICode > 57))
            return false;
        return true;
    }

</script>
