    <script>
        let html5QrCode;
        let isScanning = false;

        function onScanSuccess(decodedText, decodedResult) {
            console.log(`Scan result: ${decodedText}`);
            
            // Play Beep
            var audio = document.getElementById('audio-success');
            if (audio) audio.play().catch(e => console.log(e));

            // Stop Scanning and Redirect
            stopCamera().then(() => {
                 window.location.href = "input_izin.php?nisn=" + encodeURIComponent(decodedText);
            });
        }

        function onScanError(errorMessage) {
            // handle on error condition
        }

        async function startCamera() {
            try {
                html5QrCode = new Html5Qrcode("reader");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    {
                        fps: 10,
                        qrbox: 180,
                        aspectRatio: 1.0, 
                        formatsToSupport: [ 
                            Html5QrcodeSupportedFormats.QR_CODE,
                            Html5QrcodeSupportedFormats.CODE_128,
                            Html5QrcodeSupportedFormats.CODE_39,
                            Html5QrcodeSupportedFormats.EAN_13
                        ]
                    },
                    onScanSuccess,
                    onScanError
                );
                
                // UI Updates
                isScanning = true;
                $('#idle-placeholder').hide();
                $('.scan-area-wrapper').addClass('scanning-active');
                
                // Change Button to Stop
                $('#camera-permission').removeClass('btn-camera').addClass('btn-danger')
                    .html('<i class="fa fa-stop mr-1.5"></i> STOP KAMERA');

            } catch (err) {
                console.error(err);
                iziToast.error({
                    title: 'Akses Kamera',
                    message: 'Gagal membuka kamera: ' + err,
                    position: 'topCenter'
                });
            }
        }

        async function stopCamera() {
            if(html5QrCode && isScanning) {
                try {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                    
                    // UI Updates
                    isScanning = false;
                    $('#idle-placeholder').show();
                    $('.scan-area-wrapper').removeClass('scanning-active');
                    
                    // Change Button to Start
                    $('#camera-permission').removeClass('btn-danger').addClass('btn-camera')
                        .html('<i class="fa fa-camera mr-1.5"></i> MULAI SCAN KAMERA');
                        
                } catch (err) {
                    console.error("Failed to stop", err);
                }
            }
        }

        $("#camera-permission").click(function(){
            if(isScanning) {
                stopCamera();
            } else {
                startCamera();
            }
        });

        // Manual Input Handler
        $("#btn-manual").click(function() {
            var code = $("#manual-code").val().trim();
            if (code !== "") {
                 window.location.href = "input_izin.php?nisn=" + encodeURIComponent(code);
            } else {
                 iziToast.warning({
                    title: 'Perhatian',
                    message: 'Silakan isi NISN terlebih dahulu, atau klik link formulir di bawah',
                    position: 'topCenter'
                });
            }
        });

        $("#manual-code").on('keypress', function(e) {
            if (e.which === 13) {
                $("#btn-manual").click();
            }
        });
        
        function onlyNumberKey(evt) {
            var ASCIICode = (evt.which) ? evt.which : evt.keyCode;
            if (ASCIICode > 31 && (ASCIICode < 48 || ASCIICode > 57))
                return false;
            return true;
        }

    </script>
